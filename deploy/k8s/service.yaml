apiVersion: v1
kind: Service
metadata:
  name: vulnforge-api
  namespace: vulnforge
  labels:
    app.kubernetes.io/name: vulnforge
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vulnforge
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: vulnforge-web
  namespace: vulnforge
  labels:
    app.kubernetes.io/name: vulnforge
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vulnforge
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
