apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnforge-api
  namespace: vulnforge
  labels:
    app.kubernetes.io/name: vulnforge
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vulnforge
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vulnforge
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/huzjie/vulnforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: VULNFORGE_CONFIG
              value: /app/config/config.yaml
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: results
              mountPath: /app/results
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: vulnforge-config
        - name: results
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnforge-web
  namespace: vulnforge
  labels:
    app.kubernetes.io/name: vulnforge
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vulnforge
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vulnforge
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/huzjie/vulnforge-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: VULNFORGE_API_HOST
              value: vulnforge-api
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
