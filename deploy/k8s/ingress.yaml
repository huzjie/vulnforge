apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulnforge
  namespace: vulnforge
  labels:
    app.kubernetes.io/name: vulnforge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: vulnforge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vulnforge-web
                port:
                  number: 80
